name: Build OpenWrt 25.12.2 x86_64

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions (true/false)'
        required: true
        default: 'false'
        type: choice
        options:
          - "true"
          - "false"
      version:
        description: 'OpenWrt version'
        required: true
        default: 'v25.12.2'
        type: string

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-25.12
  BUILD_ROOT: ${{ github.workspace }}/openwrt
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update && sudo apt-get -qq upgrade
          sudo apt-get -qq install build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-pip python3-pyelftools quilt rsync unzip zlib1g-dev file wget libelf-dev
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Maximize build disk space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Download OpenWrt sources
        run: |
          git clone --branch ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} ${{ env.BUILD_ROOT }}
          cd ${{ env.BUILD_ROOT }}

      - name: Checkout v25.12.2
        run: |
          cd ${{ env.BUILD_ROOT }}
          git checkout v25.12.2
          echo "当前编译版本: $(git describe --tags)"

      - name: Setup feeds
        run: |
          cd ${{ env.BUILD_ROOT }}
          cat > feeds.conf << 'FEEDS_END'
src-git packages https://github.com/openwrt/packages.git^{branch=openwrt-25.12}
src-git luci https://github.com/openwrt/luci.git^{branch=openwrt-25.12}
src-git routing https://github.com/openwrt/routing.git^{branch=openwrt-25.12}
src-git jerrykuku https://github.com/jerrykuku/luci-app-argon-config.git
FEEDS_END
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create custom .config (x86_64 + 中文 + Argon + iStore + Docker + BBR + diskman)
        run: |
          cd ${{ env.BUILD_ROOT }}
          > .config
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_GENERIC=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-package-manager=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
          echo "CONFIG_PACKAGE_docker=y" >> .config
          echo "CONFIG_PACKAGE_dockerd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-docker=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
          echo "CONFIG_PACKAGE_turboacc_INCLUDE_BBR_CCA=y" >> .config
          echo "CONFIG_PACKAGE_zerotier=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> .config
          echo "CONFIG_PACKAGE_udpxy=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-udpxy=y" >> .config
          echo "CONFIG_PACKAGE_gowebdav=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-gowebdav=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-diskman=y" >> .config
          echo "CONFIG_PACKAGE_parted=y" >> .config
          echo "CONFIG_PACKAGE_e2fsprogs=y" >> .config
          echo "CONFIG_PACKAGE_fdisk=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ntfs3=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config
